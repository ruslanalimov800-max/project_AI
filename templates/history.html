{% extends "base.html" %}{% block content %}<h1>История проверок</h1><table class="table"><thead><tr><th>Дата</th><th>Тип</th><th>Текст</th><th>Риск</th><th>Баллы</th></tr></thead><tbody>{% for c in checks %}<tr><td>{{ c.created_at }}</td><td>{{ c.check_type }}</td><td>{{ c.input_masked|truncatechars:80 }}</td><td>{{ c.risk_level }}</td><td>{{ c.risk_score }}</td></tr>{% empty %}<tr><td colspan="5">Проверок пока нет.</td></tr>{% endfor %}</tbody></table>{% endblock %}
